name: Check submission

# Runs on the pull request itself with a read-only token: the checks fetch and
# install plugins but never run their code, and the report goes to the job
# summary rather than a comment, which a fork's token could not post anyway.
on:
  pull_request:
    paths:
      - "plugins/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Plugins are installed with the newest lerd release, betas included, once
      # one has plugins; until then, or when the repository variable LERD_REF
      # names a branch, with lerd built from it, so approval can run ahead.
      - name: Pick the lerd to check with
        id: lerd
        env:
          GH_TOKEN: ${{ github.token }}
          LERD_REF: ${{ vars.LERD_REF }}
        run: |
          mkdir -p "$RUNNER_TEMP/lerd"
          if [ -z "$LERD_REF" ]; then
            tag=$(gh release list --repo lerd-env/lerd --limit 1 --json tagName --jq '.[0].tagName')
            gh release download "$tag" --repo lerd-env/lerd --pattern 'lerd_*_linux_amd64.tar.gz' --dir "$RUNNER_TEMP/lerd"
            tar -xzf "$RUNNER_TEMP"/lerd/lerd_*_linux_amd64.tar.gz -C "$RUNNER_TEMP/lerd"
            if "$RUNNER_TEMP/lerd/lerd" plugin --help >/dev/null 2>&1; then
              "$RUNNER_TEMP/lerd/lerd" --version
              exit 0
            fi
            echo "lerd $tag has no plugins; building main."
          fi
          echo "ref=${LERD_REF:-main}" >> "$GITHUB_OUTPUT"

      - name: Fetch lerd's source
        if: steps.lerd.outputs.ref
        uses: actions/checkout@v4
        with:
          repository: lerd-env/lerd
          ref: ${{ steps.lerd.outputs.ref }}
          path: lerd-src

      - if: steps.lerd.outputs.ref
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build lerd
        if: steps.lerd.outputs.ref
        working-directory: lerd-src
        run: |
          go_version=$(sed -n 's/^toolchain go//p' go.mod)
          make build-ui
          # Stamped dev, an untagged build, so the lerd bound of a plugin aimed at
          # the coming release does not refuse it.
          GOTOOLCHAIN="go${go_version:-$(go env GOVERSION | sed 's/^go//')}" CGO_ENABLED=0 \
            go build -tags nogui -ldflags "-X github.com/geodro/lerd/internal/version.Version=dev" -o "$RUNNER_TEMP/lerd/lerd" ./cmd/lerd
          "$RUNNER_TEMP/lerd/lerd" --version

      # Each area is a step of its own, so the step that fails names what is wrong
      # and its log says why; the summary page carries the whole report.
      - name: "Entry: the file, a public repository, a commit that fetches"
        id: entry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          changed=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'plugins/*.yaml' | tr '\n' ' ')
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ -z "$changed" ]; then
            echo "No entry added or changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          go build -o check-bin ./ci/check
          ./check-bin -lerd "$RUNNER_TEMP/lerd/lerd" -only entry -report "$GITHUB_STEP_SUMMARY" $changed

      - name: "Repository: a license and a README"
        if: ${{ !cancelled() && steps.entry.outcome == 'success' && steps.entry.outputs.changed }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./check-bin -lerd "$RUNNER_TEMP/lerd/lerd" -only repository -report "$GITHUB_STEP_SUMMARY" ${{ steps.entry.outputs.changed }}

      - name: "Manifest: lerd bound, platforms, screenshots"
        if: ${{ !cancelled() && steps.entry.outcome == 'success' && steps.entry.outputs.changed }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./check-bin -lerd "$RUNNER_TEMP/lerd/lerd" -only manifest -report "$GITHUB_STEP_SUMMARY" ${{ steps.entry.outputs.changed }}

      - name: "Services: pinned images the README names"
        if: ${{ !cancelled() && steps.entry.outcome == 'success' && steps.entry.outputs.changed }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./check-bin -lerd "$RUNNER_TEMP/lerd/lerd" -only services -report "$GITHUB_STEP_SUMMARY" ${{ steps.entry.outputs.changed }}

      - name: "Images: format and size"
        if: ${{ !cancelled() && steps.entry.outcome == 'success' && steps.entry.outputs.changed }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./check-bin -lerd "$RUNNER_TEMP/lerd/lerd" -only images -report "$GITHUB_STEP_SUMMARY" ${{ steps.entry.outputs.changed }}

      - name: "Code: no binaries, nothing piped to a shell"
        if: ${{ !cancelled() && steps.entry.outcome == 'success' && steps.entry.outputs.changed }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./check-bin -lerd "$RUNNER_TEMP/lerd/lerd" -only code -report "$GITHUB_STEP_SUMMARY" ${{ steps.entry.outputs.changed }}

      - name: "Installs beside every listed plugin"
        if: ${{ !cancelled() && steps.entry.outcome == 'success' && steps.entry.outputs.changed }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./check-bin -lerd "$RUNNER_TEMP/lerd/lerd" -only install -report "$GITHUB_STEP_SUMMARY" ${{ steps.entry.outputs.changed }}

  # A submission changes its own entry and nothing else; changes to the checks
  # come from maintainers in pull requests of their own.
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only entries changed
        run: |
          other=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -v '^plugins/[a-z][a-z0-9-]*\.yaml$' || true)
          if [ -n "$other" ]; then
            echo "A submission may only change files under plugins/. Also changed:" >&2
            echo "$other" >&2
            exit 1
          fi
